<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HABOS Admin</title>
<style>
:root{--gold:#f7b900;--dark:#0b0b0b;--bg:#f6f2e9;--line:#ddd2bd}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}
header{position:sticky;top:0;z-index:9;background:#0b0b0b;color:#fff;padding:16px 4vw;border-bottom:4px solid var(--gold);display:flex;justify-content:space-between;align-items:center}
header h1{font-size:22px;margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}
.login,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 30px #0001}.login{max-width:520px;margin:50px auto}
input,select,textarea{width:100%;padding:11px;border:1px solid #d9d9d9;border-radius:9px;font:inherit}textarea{min-height:70px}
button{font:inherit;cursor:pointer}.primary{border:0;background:var(--gold);padding:12px 17px;border-radius:10px;font-weight:900}.dark{background:#111;color:#fff}.danger{background:#a92c2c;color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.setting{display:grid;gap:6px;font-weight:800}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.cat{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800}.cat.active{background:#111;color:#fff}
.products{display:grid;gap:12px}.product{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.prow{display:grid;grid-template-columns:1.2fr 2fr auto auto;gap:10px;align-items:center}.options{margin-top:12px;display:grid;gap:8px}.opt{display:grid;grid-template-columns:1fr 140px auto;gap:8px}
.switch{display:flex;align-items:center;gap:7px;font-weight:800}.muted{color:#777;font-size:13px}.status{padding:10px;border-radius:9px;margin:10px 0;display:none}.ok{display:block;background:#e7f7e9;color:#21652b}.err{display:block;background:#fdeaea;color:#932626}
@media(max-width:750px){.settings{grid-template-columns:1fr}.prow{grid-template-columns:1fr}.opt{grid-template-columns:1fr 110px auto}}
</style></head><body>
<header><h1>HABOS Admin</h1><a href="/" style="color:#ffd34e">Website ansehen</a></header>
<div class="wrap">
<div class="login" id="loginBox"><h2>Admin anmelden</h2><p class="muted">Das Passwort wird nur für das Speichern an Netlify gesendet.</p><input id="pw" type="password" placeholder="Admin-Passwort"><button class="primary dark" style="margin-top:10px;width:100%" onclick="login()">Anmelden</button><div id="loginStatus" class="status"></div></div>
<div id="adminBox" style="display:none">
<div class="panel">
<h2>Einstellungen</h2>
<div class="settings">
<label class="setting">Menü-Aufpreis €<input id="menuPrice" type="number" step=".10"></label>
<label class="setting">Lieferkosten €<input id="deliveryFee" type="number" step=".10"></label>
<label class="setting">Mindestbestellwert €<input id="minimumDelivery" type="number" step=".10"></label>
<label class="setting">WhatsApp Nummer<input id="phone"></label>
<label class="setting">Telefon Anzeige<input id="displayPhone"></label>
<label class="setting">E-Mail<input id="email"></label>
</div>
<div class="toolbar"><button class="primary" onclick="addProduct()">+ Produkt hinzufügen</button><button class="primary dark" onclick="save()">Alle Änderungen speichern</button></div>
<div id="saveStatus" class="status"></div>
</div>
<h2>Speisekarte</h2>
<div class="cats" id="cats"></div>
<div class="products" id="products"></div>
</div>
</div>
<script>
let cfg=null, password='', activeCat='';
async function fetchCfg(){
 const r=await fetch('/.netlify/functions/catalog',{cache:'no-store'});
 if(!r.ok) throw new Error('Konfiguration konnte nicht geladen werden.');
 return r.json();
}
async function login(){
 password=pw.value;
 if(!password){show(loginStatus,'Passwort eingeben.','err');return}
 try{
   cfg=await fetchCfg();
   loginBox.style.display='none';adminBox.style.display='block';
   fillSettings();renderCats();
 }catch(e){show(loginStatus,e.message,'err')}
}
function show(el,msg,type){el.className='status '+type;el.textContent=msg}
function fillSettings(){
 menuPrice.value=cfg.settings.menuPrice;deliveryFee.value=cfg.settings.deliveryFee;minimumDelivery.value=cfg.settings.minimumDelivery;
 phone.value=cfg.settings.phone||'';displayPhone.value=cfg.settings.displayPhone||'';email.value=cfg.settings.email||'';
}
function categories(){return [...new Set(cfg.products.map(p=>p.cat))]}
function renderCats(){
 const cs=categories(); if(!activeCat||!cs.includes(activeCat)) activeCat=cs[0]||'Burger';
 cats.innerHTML=cs.map(c=>`<button class="cat ${c===activeCat?'active':''}" onclick="activeCat=${JSON.stringify(c)};renderCats()">${c}</button>`).join('');
 renderProducts();
}
function renderProducts(){
 const list=cfg.products.map((p,i)=>({p,i})).filter(x=>x.p.cat===activeCat);
 products.innerHTML=list.map(({p,i})=>`
 <div class="product">
   <div class="prow">
    <input value="${esc(p.name)}" onchange="cfg.products[${i}].name=this.value" placeholder="Produktname">
    <textarea onchange="cfg.products[${i}].desc=this.value">${esc(p.desc||'')}</textarea>
    <label class="switch"><input type="checkbox" ${p.active!==false?'checked':''} onchange="cfg.products[${i}].active=this.checked"> Sichtbar</label>
    <label class="switch"><input type="checkbox" ${p.soldOut?'checked':''} onchange="cfg.products[${i}].soldOut=this.checked"> Ausverkauft</label>
   </div>
   <div class="options">${(p.options||[]).map((o,j)=>`
     <div class="opt"><input value="${esc(o[0])}" onchange="cfg.products[${i}].options[${j}][0]=this.value"><input type="number" step=".10" value="${o[1]}" onchange="cfg.products[${i}].options[${j}][1]=Number(this.value)"><button onclick="cfg.products[${i}].options.splice(${j},1);renderProducts()">×</button></div>`).join('')}</div>
   <div class="toolbar"><button onclick="cfg.products[${i}].options.push(['Neue Größe',0]);renderProducts()">+ Größe/Preis</button><button class="danger" onclick="if(confirm('Produkt löschen?')){cfg.products.splice(${i},1);renderCats()}">Produkt löschen</button></div>
 </div>`).join('');
}
function addProduct(){
 const cat=prompt('Kategorie',activeCat||'Burger');if(!cat)return;
 cfg.products.push({cat,name:'Neues Produkt',desc:'',icon:'🍔',options:[['Standard',0]],menu:false,active:true,soldOut:false});
 activeCat=cat;cfg.products[cfg.products.length-1].cat=cat;renderCats();
}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
async function save(){
 cfg.settings.menuPrice=Number(menuPrice.value);cfg.settings.deliveryFee=Number(deliveryFee.value);cfg.settings.minimumDelivery=Number(minimumDelivery.value);
 cfg.settings.phone=phone.value.trim();cfg.settings.displayPhone=displayPhone.value.trim();cfg.settings.email=email.value.trim();
 try{
   const r=await fetch('/.netlify/functions/catalog',{method:'POST',headers:{'content-type':'application/json','x-admin-password':password},body:JSON.stringify(cfg)});
   const j=await r.json().catch(()=>({}));
   if(!r.ok) throw new Error(j.error||'Speichern fehlgeschlagen');
   show(saveStatus,'Gespeichert. Die Live-Website verwendet jetzt die neuen Daten.','ok');
 }catch(e){show(saveStatus,e.message,'err')}
}
</script></body></html>
